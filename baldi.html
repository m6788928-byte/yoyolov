<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/baldis-basics/">
  <title>Baldi's Basics</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#231f20}.webgl-content{position:fixed;inset:0;width:100%;height:100%}</style>
  <script>
    window.fileMergerConfig={
      files:[
        {name:"baldi.data.unityweb",parts:2},
        {name:"baldi.wasm.code.unityweb",parts:1},
        {name:"baldi.wasm.framework.unityweb",parts:1}
      ],
      basePath:"unity/",
      debug:false
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="baldi.js"></script>
</head>
<body>
  <div class="webgl-content">
    <div id="unityContainer" style="width:960px;height:600px;padding:0;margin:0;border:0;position:relative;background:#231f20">
      <div id="gameContainer" style="width:800px;height:560px;margin:auto"></div>
    </div>
  </div>
  <script>
    var gameInstance=UnityLoader.instantiate("gameContainer","baldi.json",{
      onProgress:UnityProgress,
      Module:{onRuntimeInitialized:function(){UnityProgress(gameInstance,"complete");}}
    });
  </script>
  <script src="firebase-app.js"></script>
</body>
</html>
