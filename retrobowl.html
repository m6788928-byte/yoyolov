<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Bowl</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111820;color:#f4f5f6;font:14px system-ui,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:18px}
main{width:min(520px,100%);text-align:center;border:1px solid #303c48;background:#18232e;padding:28px 22px;border-radius:12px}
.ball{width:94px;height:58px;margin:0 auto 18px;background:#b66d37;border:4px solid #e7c29f;border-radius:50%;transform:rotate(-24deg);position:relative;box-shadow:inset 0 0 0 3px #7a4428}
.ball:before{content:"";position:absolute;left:37px;top:7px;width:10px;height:36px;border-left:3px solid #fff;border-right:3px solid #fff}
h1{margin:0 0 8px;font-size:25px}p{color:#aeb9c3;line-height:1.5;margin:0 0 20px}
a{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:7px;background:#e4b36b;color:#17202a;font-weight:750;text-decoration:none}
a:hover{background:#f1c17a}
small{display:block;margin-top:14px;color:#8794a0}
</style>
</head>
<body>
<main>
  <div class="ball" aria-hidden="true"></div>
  <h1>Retro Bowl</h1>
  <p>Launch the official licensed browser version from Poki.</p>
  <a href="https://poki.com/en/g/retro-bowl" target="_blank" rel="noopener noreferrer">Play Retro Bowl</a>
  <small>Opens in a new tab so the game can run without the broken embedded copy.</small>
</main>
</body>
</html>
