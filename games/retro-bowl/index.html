<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta charset="utf-8" />
  <meta http-equiv="pragma" content="no-cache" />
  <title>Retro Bowl</title>
  <style>
    body {
      background: #000000;
      color: #cccccc;
      margin: 0px;
      padding: 0px;
      border: 0px;
    }

    canvas {
      image-rendering: pixelated;
      -webkit-interpolation-mode: nearest-neighbor;
      -ms-touch-action: none;
      touch-action: none;
      margin: 0px;
      padding: 0px;
      border: 0px;
    }

    :-webkit-full-screen #canvas {
      width: 100%;
      height: 100%;
    }

    :-webkit-full-screen {
      width: 100%;
      height: 100%;
    }

    /* Custom Runner Styles */
    div.gm4html5_div_class {
      margin: 0px;
      padding: 0px;
      border: 0px;
    }

    div.gm4html5_login {
      padding: 20px;
      position: absolute;
      border: solid 2px #000000;
      background-color: #404040;
      color: #00ff00;
      border-radius: 15px;
      box-shadow: #101010 20px 20px 40px;
    }

    div.gm4html5_cancel_button {
      float: right;
    }

    div.gm4html5_login_button {
      float: left;
    }

    div.gm4html5_login_header {
      text-align: center;
    }

    :-webkit-full-screen {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="gm4html5_div_class" id="gm4html5_div_id">
    <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display:none;" />
    <!-- Create the canvas element the game draws to -->
    <canvas id="canvas" width="853" height="480" style="position: absolute; top: 50%; left: 50%; bottom: -50%; right: -50%; transform: translate(-50%, -50%);">
      <p>Your browser doesn't support HTML5 canvas.</p>
    </canvas>
  </div>
  <script type="text/javascript" src="html5game/RetroBowl.js"></script>
  <script>
    window.addEventListener("load", function () {
      if (typeof window.GameMaker_Init === "function") {
        try { window.GameMaker_Init(); }
        catch (error) {
          const message = document.createElement("div");
          message.style.cssText = "position:fixed;inset:0;padding:24px;background:#000;color:#fff;font:16px Arial;z-index:99";
          message.textContent = "Retro Bowl failed to start: " + (error.message || error);
          document.body.append(message);
        }
      } else {
        const message = document.createElement("div");
        message.style.cssText = "position:fixed;inset:0;padding:24px;background:#000;color:#fff;font:16px Arial;z-index:99";
        message.textContent = "Retro Bowl's game engine did not load. Reload the game. If this continues, its game files need replacing.";
        document.body.append(message);
      }
    });
  </script>
  
</body>

</html>
