    catch (_) { try { Object.defineProperty(navigator, "getGamepads", { configurable:true, value:() => [] }); } catch (_) {} }
    try { Object.defineProperty(Navigator.prototype, "webkitGetGamepads", { configurable:true, value:() => [] }); }
    catch (_) { try { Object.defineProperty(navigator, "webkitGetGamepads", { configurable:true, value:() => [] }); } catch (_) {} }
  </script>
