<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wordle</title><style>
*{box-sizing:border-box}body{margin:0;background:#121213;color:#fff;font:16px Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}main{width:min(420px,100%);padding:18px}.head{text-align:center;border-bottom:1px solid #3a3a3c;padding:8px;font-size:28px;font-weight:bold;letter-spacing:3px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(320px,100%);margin:28px auto}.cell{aspect-ratio:1;border:2px solid #3a3a3c;display:grid;place-items:center;font-size:30px;font-weight:bold}.filled{border-color:#777}.correct{background:#538d4e;border-color:#538d4e}.present{background:#b59f3b;border-color:#b59f3b}.absent{background:#3a3a3c;border-color:#3a3a3c}.keys{display:grid;gap:6px;margin-top:25px}.row{display:flex;justify-content:center;gap:4px}.key{border:0;border-radius:4px;background:#818384;color:white;font-weight:bold;height:52px;min-width:8%;flex:1;padding:0 5px;cursor:pointer}.key.wide{flex:1.5;font-size:12px}.msg{text-align:center;height:24px;margin:12px}.actions{text-align:center}.actions button{background:#538d4e;color:white;border:0;border-radius:5px;padding:9px 16px;cursor:pointer}
</style><main><div class="head">WORDLE</div><div id="grid" class="grid"></div><div id="msg" class="msg"></div><div id="keys" class="keys"></div><div class="actions"><button id="again" hidden>Play again</button></div></main><script>
const answers=["crane","slate","stare","audio","trace","light","proud","brave","flame","green","world","plant","stone","quick","heart","dream","spike","candy","grape","smile"];
const valid=new Set(answers.concat(("about above abuse actor acute admit adopt adult after again agent agree ahead alarm album alert alike alive allow alone along alter among anger angle angry apart apple apply arena argue arise array aside asset avoid awake award aware badly baker bases basic beach began begin being below bench birth black blame blank blind block blood board boost brain bread break brief bring broad broke brown build buyer cabin cable carry catch cause chain chair chart chase cheap check chest chief child china chose civil claim class clean clear climb clock close cloud coach coast could count court cover craft crash cream crime cross crowd crown curve cycle daily dance dated dealt death debut delay depth doing doubt dozen draft drama drawn dress drink drive earth eight elite empty enemy enjoy enter equal error event every exact exist extra faith false fault fiber field fifth fifty fight final first fixed flash floor focus force forth forty forum found frame frank fraud fresh front fruit fully funny giant given glass globe going grace grade grand grant grass great group grown guard guess guest guide happy heavy hence horse hotel house human ideal image index inner input issue japan joint judge known label large laser later laugh layer learn lease least leave legal level lewis local logic loose lower lucky lunch magic major maker march match maybe mayor meant media metal might minor minus mixed model money month moral motor mount mouse mouth movie music needs never newly night noise north noted novel nurse occur ocean offer often order other ought paint panel paper party peace phase phone photo piece pilot pitch place plain plane point pound power press price prime print prior proof prove queen radio raise range rapid ratio reach ready refer right river robin rough round route royal rural scale scene scope score sense serve seven shall shape share sharp sheet shelf shell shift shirt shock shoot short shown sight since skill sleep small smart smoke solid solve sorry sound south space spare speak speed spend spent split sport staff stage stand start state steam steel stick still stock store storm story strip study stuff style sugar suite super sweet table taken taste teach teeth theme there these thick thing think third those three throw tight times title today topic total touch tough tower track trade train treat trend trial tried tries truck truly trust truth twice under undue union unity until upper upset urban usage usual valid value video virus visit vital voice waste watch water wheel where which while white whole whose woman women worry worse worst worth would write wrong wrote yield young youth").split(" ")));
let answer=answers[Math.floor(Math.random()*answers.length)],guess="",rows=[],done=false;
const grid=document.querySelector("#grid"),msg=document.querySelector("#msg"),keys=document.querySelector("#keys");
function draw(){grid.innerHTML="";for(let r=0;r<6;r++)for(let c=0;c<5;c++){let el=document.createElement("div");el.className="cell";let val=rows[r]?.word?.[c]??(r===rows.length?guess[c]:"");el.textContent=val||"";if(val)el.classList.add("filled");if(rows[r])el.classList.add(rows[r].marks[c]);grid.append(el)}}
function keyboard(){keys.innerHTML="";["QWERTYUIOP","ASDFGHJKL","ENTERZXCVBNM⌫"].forEach(line=>{let row=document.createElement("div");row.className="row";for(let ch of (line==="ENTERZXCVBNM⌫"?["ENTER",..."ZXCVBNM","⌫"]:[...line])){let b=document.createElement("button");b.className="key"+(["ENTER","⌫"].includes(ch)?" wide":"");b.textContent=ch;b.onclick=()=>press(ch.toLowerCase());row.append(b)}keys.append(row)})}
function press(k){if(done)return;if(k==="enter"){if(guess.length!==5)return;if(!valid.has(guess)){msg.textContent="Not in word list";return}let counts={};for(let c of answer)counts[c]=(counts[c]||0)+1;let marks=Array(5).fill("absent");for(let i=0;i<5;i++)if(guess[i]===answer[i]){marks[i]="correct";counts[guess[i]]--}for(let i=0;i<5;i++)if(marks[i]!=="correct"&&counts[guess[i]]>0){marks[i]="present";counts[guess[i]]--}rows.push({word:guess,marks});let win=guess===answer;guess="";if(win||rows.length===6){done=true;msg.textContent=win?"Excellent!":"The word was "+answer.toUpperCase();document.querySelector("#again").hidden=false}}else if(k==="backspace")guess=guess.slice(0,-1);else if(/^[a-z]$/.test(k)&&guess.length<5)guess+=k;draw()}
document.addEventListener("keydown",e=>{if(e.key==="Enter")press("enter");else if(e.key==="Backspace")press("backspace");else press(e.key.toLowerCase())});document.querySelector("#again").onclick=()=>{answer=answers[Math.floor(Math.random()*answers.length)];guess="";rows=[];done=false;msg.textContent="";document.querySelector("#again").hidden=true;draw()};keyboard();draw();
</script></html>
