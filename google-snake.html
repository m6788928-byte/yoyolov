<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Snake</title>
<style>
:root{color-scheme:dark;--bg:#111214;--panel:#1b1d21;--line:#30343b;--text:#eee;--muted:#9299a4;--blue:#8ab4f8;--green:#81c995}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.game{width:min(620px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h1{font-size:22px;margin:0}.stats{display:flex;gap:18px;color:var(--muted)}.stats b{color:var(--text);font-size:18px;display:block}canvas{width:100%;aspect-ratio:1;background:#202124;border:1px solid var(--line);border-radius:12px;display:block;touch-action:none}.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.group{display:flex;gap:7px;align-items:center}button,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 13px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--blue)}.hint{color:var(--muted);font-size:12px;margin-top:12px;text-align:center}.overlay{position:relative}.message{position:absolute;inset:0;display:grid;place-items:center;background:#111214c9;border-radius:12px;text-align:center}.message div{background:var(--panel);border:1px solid var(--line);padding:22px 26px;border-radius:12px}.message strong{display:block;font-size:22px;margin-bottom:6px}.pad{display:none;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:4px}.pad button{padding:0}@media(max-width:560px){.pad{display:grid}.hint{max-width:320px;margin-inline:auto}}
</style></head><body><main class="game"><header><h1>Google Snake</h1><div class="stats"><div>Score<b id="score">0</b></div><div>Best<b id="best">0</b></div></div></header><div class="overlay"><canvas id="board" width="600" height="600" aria-label="Snake game board"></canvas><div class="message" id="message"><div><strong>Snake</strong><span>Eat apples. Don't hit the wall or yourself.</span><p><button id="start">Play</button></p></div></div></div><div class="controls"><div class="group"><button id="pause">Pause</button><button id="restart">Restart</button><select id="speed" aria-label="Game speed"><option value="145">Normal</option><option value="105">Fast</option><option value="185">Slow</option></select></div><div class="pad" aria-label="Touch controls"><span></span><button data-dir="up">↑</button><span></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div></div><div class="hint">Arrow keys or WASD to move · Space to pause · Swipe on touchscreens</div></main>
<script>
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d'),N=20,C=30;
let snake,dir,next,food,score,loop=null,running=false,paused=false,best=Number(localStorage.getItem('google-snake-best')||0);
$('best').textContent=best;
function randomFood(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function reset(){clearInterval(loop);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={...dir};score=0;running=false;paused=false;food=randomFood();$('score').textContent=0;$('pause').textContent='Pause';$('message').style.display='grid';$('message').querySelector('strong').textContent='Snake';$('message').querySelector('span').textContent='Eat apples. Don\'t hit the wall or yourself.';$('start').textContent='Play';draw()}
function start(){if(running)return;running=true;paused=false;$('message').style.display='none';$('pause').textContent='Pause';clearInterval(loop);loop=setInterval(tick,Number($('speed').value))}
function pause(){if(!running)return;paused=!paused;if(paused){clearInterval(loop);$('pause').textContent='Resume';$('message').style.display='grid';$('message').querySelector('strong').textContent='Paused';$('message').querySelector('span').textContent='Take your time.';$('start').textContent='Resume'}else{ $('message').style.display='none';$('pause').textContent='Pause';loop=setInterval(tick,Number($('speed').value));}}
function end(){clearInterval(loop);running=false;$('message').style.display='grid';$('message').querySelector('strong').textContent='Game over';$('message').querySelector('span').textContent='Score: '+score;$('start').textContent='Play again'}
function setDir(x,y){if(x===-dir.x&&y===-dir.y)return;next={x,y}}
function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){end();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;localStorage.setItem('google-snake-best',best)}food=randomFood()}else snake.pop();draw()}
function draw(){ctx.fillStyle='#202124';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#2b2d31';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,600);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(600,i*C);ctx.stroke()}ctx.fillStyle='#ea4335';ctx.beginPath();ctx.arc(food.x*C+15,food.y*C+15,11,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i?'#81c995':'#a8dab5';ctx.beginPath();ctx.roundRect(s.x*C+2,s.y*C+2,C-4,C-4,7);ctx.fill()});const h=snake[0];ctx.fillStyle='#202124';ctx.beginPath();ctx.arc(h.x*C+20,h.y*C+10,2.3,0,7);ctx.arc(h.x*C+20,h.y*C+20,2.3,0,7);ctx.fill()}
$('start').onclick=()=>{if(paused){pause()}else{reset();start()}};$('pause').onclick=pause;$('restart').onclick=()=>{reset();start()};$('speed').onchange=()=>{if(running&&!paused)start()};document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(map[k]){e.preventDefault();setDir(...map[k])}if(k===' '){e.preventDefault();if(running)pause();else start()}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];setDir(...d)});let touch=null;canvas.addEventListener('pointerdown',e=>touch={x:e.clientX,y:e.clientY});canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18)setDir(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));touch=null});reset();
</script></body></html>
