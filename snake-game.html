<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Game</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;background:#17231c url("https://umaidansari12.github.io/snake_game/images/background1.png") center/cover fixed;display:grid;place-items:center;padding:18px}.screen{width:min(96vw,900px);text-align:center}.title{display:grid;place-items:center;gap:22px}.title img{width:min(88vw,717px);height:auto;max-height:45vh;object-fit:contain}.play{width:200px;padding:15px 25px;border:0;border-radius:15px;background:#337aff;color:white;font-size:24px;cursor:pointer;box-shadow:0 9px #777}.play:active{transform:translateY(4px);box-shadow:0 5px #555}.game{display:none}.hud{display:flex;justify-content:space-between;align-items:center;margin:0 auto 10px;width:min(92vw,840px);color:white;font-size:20px;font-weight:bold;text-shadow:0 2px 4px #000}.hud img{width:40px;height:46px;object-fit:contain;vertical-align:middle}.board{width:min(92vw,840px);aspect-ratio:1;margin:auto;border:20px solid green;background:#fff url("https://umaidansari12.github.io/snake_game/images/bg.jpg") center/cover}.board canvas{width:100%;height:100%;display:block}.actions{display:flex;justify-content:center;gap:10px;margin:12px}.actions button,.dialog button{padding:10px 18px;border:0;border-radius:7px;background:#337aff;color:white;font-weight:bold;cursor:pointer}.hint{color:white;text-shadow:0 1px 4px #000}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#0009;padding:20px}.dialog{background:white;color:#222;border-radius:10px;padding:24px;min-width:min(320px,90vw);box-shadow:0 12px 40px #0008}.dialog h2{margin:0 0 8px}.dialog p{margin:0 0 18px}@media(max-width:560px){.board{border-width:10px}.hud{font-size:16px}}
</style></head><body><main class="screen"><section class="title" id="title"><img src="https://umaidansari12.github.io/snake_game/images/game.PNG" alt="Snake Game"><button class="play" id="play">Play</button></section><section class="game" id="game"><div class="hud"><span><img src="https://umaidansari12.github.io/snake_game/images/trophy.png" alt=""> <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div><div class="board"><canvas id="mycanvas" width="792" height="792"></canvas></div><div class="actions"><button id="pause">Pause</button><button id="restart">Restart</button><button id="home">Title</button></div><p class="hint">Use arrow keys to move · Space to pause</p></section></main><div class="overlay" id="overlay"><div class="dialog"><h2 id="overTitle">Game over!</h2><p id="overText"></p><button id="again">Play again</button><button id="back">Title screen</button></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),c=$("mycanvas"),p=c.getContext("2d"),W=c.width,H=c.height,cs=66,cols=Math.floor(W/cs),rows=Math.floor(H/cs),apple=new Image(),trophy=new Image();apple.src="https://umaidansari12.github.io/snake_game/images/apple.png";trophy.src="https://umaidansari12.github.io/snake_game/images/trophy.png";let cells,food,score=0,best=+(localStorage.snakeBest||0),dir="right",next="right",timer=null,paused=false,over=false;$("best").textContent=best;
function foodAt(){let f;do{f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(cells.some(s=>s.x===f.x&&s.y===f.y));return f}
function reset(){cells=[{x:5,y:5},{x:4,y:5},{x:3,y:5},{x:2,y:5},{x:1,y:5}];dir=next="right";score=0;over=paused=false;$("score").textContent=0;food=foodAt();draw()}
function draw(){p.clearRect(0,0,W,H);cells.forEach((s,i)=>{p.fillStyle=i?"#337aff":"#1755bd";p.fillRect(s.x*cs,s.y*cs,cs-3,cs-3)});if(apple.complete)p.drawImage(apple,food.x*cs+5,food.y*cs+2,cs-10,cs-8);if(trophy.complete)p.drawImage(trophy,18,12,46,48)}
function tick(){dir=next;const h={x:cells[0].x,y:cells[0].y};if(dir==="right")h.x++;else if(dir==="left")h.x--;else if(dir==="down")h.y++;else h.y--;const eat=h.x===food.x&&h.y===food.y,body=eat?cells:cells.slice(0,-1);if(h.x<0||h.y<0||h.x>=cols||h.y>=rows||body.some(s=>s.x===h.x&&s.y===h.y)){finish();return}cells.unshift(h);if(eat){score++;$("score").textContent=score;if(score>best){best=score;$("best").textContent=best;localStorage.snakeBest=best}food=foodAt()}else cells.pop();draw()}
function stop(){clearInterval(timer);timer=null}
function start(){stop();reset();$("title").style.display="none";$("game").style.display="block";$("overlay").style.display="none";paused=false;timer=setInterval(tick,150);$("pause").textContent="Pause"}
function finish(){stop();over=true;$("overTitle").textContent="Game over!";$("overText").textContent="Score: "+score;$("again").textContent="Play again";$("overlay").style.display="grid"}
function pause(){if(!timer&&!paused)return;if(paused){paused=false;$("overlay").style.display="none";timer=setInterval(tick,150);$("pause").textContent="Pause"}else{paused=true;stop();$("overTitle").textContent="Paused";$("overText").textContent="Take a break.";$("again").textContent="Resume";$("overlay").style.display="grid";$("pause").textContent="Resume"}}
function turn(d){const rev={left:"right",right:"left",up:"down",down:"up"};if(timer&&d!==rev[dir])next=d}
function title(){stop();paused=false;$("overlay").style.display="none";$("game").style.display="none";$("title").style.display="grid"}
document.addEventListener("keydown",e=>{const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};if(map[e.key]){e.preventDefault();turn(map[e.key])}else if(e.code==="Space"){e.preventDefault();pause()}});
$("play").onclick=start;$("restart").onclick=start;$("pause").onclick=pause;$("home").onclick=title;$("again").onclick=()=>paused?pause():start();$("back").onclick=title;reset();
})();
</script></body></html>
