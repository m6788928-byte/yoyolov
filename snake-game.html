<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#111713;color:#eef4ed;font:14px system-ui,sans-serif}.game{width:min(94vw,650px);text-align:center}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:30px;font-weight:800;letter-spacing:3px}.scores{color:#c4d2c5}.board{position:relative;width:100%;aspect-ratio:1;background:#eaf1e5;border:8px solid #397d43;border-radius:8px;overflow:hidden}.board canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:12px;background:#0d1912c9;padding:20px}.overlay[hidden]{display:none}.overlay h2{font-size:36px;margin:0}.overlay p{margin:0;color:#d3dfd4}.buttons{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.btn{border:1px solid #527459;background:#1d3021;color:white;border-radius:8px;padding:10px 18px;font:600 14px system-ui;cursor:pointer}.primary{background:#347b42}.help{color:#adbdaf;font-size:12px}.pad{display:none;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin-top:12px}.pad button{height:42px;background:#1d3021;border:1px solid #527459;border-radius:7px;color:white;font-size:18px}@media(max-width:600px),(pointer:coarse){.pad{display:grid}}
</style></head><body><main class="game"><header class="head"><div class="title">SNAKE</div><div class="scores">SCORE <b id="score">0</b>　BEST <b id="best">0</b></div></header><section class="board"><canvas id="c" width="600" height="600"></canvas><div class="overlay" id="overlay"><h2 id="heading">Snake</h2><p id="message">Eat apples. Don't hit the walls or yourself.</p><button class="btn primary" id="start">Play</button></div></section><div class="buttons"><button class="btn" id="pause">Pause</button><button class="btn" id="restart">Restart</button></div><div class="pad"><i></i><button data-dir="up">▲</button><i></i><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><p class="help">Arrow keys / WASD to move · Space to pause · Enter to start</p></main>
<script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),n=20,cell=30,$=id=>document.getElementById(id);let body,dir,next,food,score,best=+(localStorage.snakeBest||0),loop=null,running=false,ended=false;$('best').textContent=best;
function reset(){body=[{x:9,y:10},{x:8,y:10},{x:7,y:10},{x:6,y:10},{x:5,y:10}];dir=next={x:1,y:0};score=0;ended=false;$('score').textContent=0;food=spawn();draw()}
function spawn(){let p;do{p={x:Math.random()*n|0,y:Math.random()*n|0}}while(body.some(s=>s.x===p.x&&s.y===p.y));return p}
function draw(){g.fillStyle='#eaf1e5';g.fillRect(0,0,600,600);g.strokeStyle='#d5e1d0';g.lineWidth=1;for(let i=0;i<=n;i++){g.beginPath();g.moveTo(i*cell,0);g.lineTo(i*cell,600);g.stroke();g.beginPath();g.moveTo(0,i*cell);g.lineTo(600,i*cell);g.stroke()}g.fillStyle='#d83c36';g.beginPath();g.arc(food.x*cell+15,food.y*cell+15,11,0,7);g.fill();body.forEach((p,i)=>{g.fillStyle=i?'#347b42':'#205d2d';g.fillRect(p.x*cell+2,p.y*cell+2,cell-4,cell-4);if(!i){g.fillStyle='white';g.fillRect(p.x*cell+7,p.y*cell+8,4,4);g.fillRect(p.x*cell+19,p.y*cell+8,4,4)}})}
function tick(){dir=next;const h={x:body[0].x+dir.x,y:body[0].y+dir.y},eat=h.x===food.x&&h.y===food.y,collision=eat?body:body.slice(0,-1);if(h.x<0||h.y<0||h.x>=n||h.y>=n||collision.some(p=>p.x===h.x&&p.y===h.y)){finish();return}body.unshift(h);if(eat){score++;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;localStorage.snakeBest=best}food=spawn()}else body.pop();draw()}
function stop(){running=false;clearInterval(loop);loop=null}
function play(){if(ended)reset();if(running)return;running=true;$('overlay').hidden=true;$('pause').textContent='Pause';loop=setInterval(tick,125)}
function finish(){stop();ended=true;$('heading').textContent='Game over';$('message').textContent='Score: '+score+'. Try again?';$('start').textContent='Play again';$('overlay').hidden=false}
function pause(){if(ended)return;if(running){stop();$('heading').textContent='Paused';$('message').textContent='Ready when you are.';$('start').textContent='Resume';$('overlay').hidden=false;$('pause').textContent='Resume'}else play()}
function turn(d){if(running&&!(d.x===-dir.x&&d.y===-dir.y))next=d}
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k]){e.preventDefault();turn(dirs[map[k]])}else if(k===' '){e.preventDefault();pause()}else if(k==='enter'&&!running)play()});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(dirs[b.dataset.dir]));$('start').onclick=play;$('pause').onclick=pause;$('restart').onclick=()=>{stop();reset();$('heading').textContent='Snake';$('message').textContent="Eat apples. Don't hit the walls or yourself.";$('start').textContent='Play';$('overlay').hidden=false;$('pause').textContent='Pause'};reset();
})();
</script></body></html>
