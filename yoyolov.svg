<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="100%" height="100%" viewBox="0 0 1920 1080">
  <foreignObject width="1920" height="1080" x="0" y="0">
    <xhtml:html xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;padding:0;">
      <xhtml:head>
        <xhtml:style>
          *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
          html,body{width:100%;height:100%;overflow:hidden;background:#000}
          iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
        </xhtml:style>
      </xhtml:head>
      <xhtml:body>
        <xhtml:iframe title="Yoyolov" src="https://m6788928-byte.github.io/yoyolov/"></xhtml:iframe>
        <xhtml:script><![CDATA[
          (function(){
            function resize(){
              var w=window.innerWidth,h=window.innerHeight;
              var s=document.querySelector('svg'),f=document.querySelector('foreignObject');
              if(s){s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('viewBox','0 0 '+w+' '+h);}
              if(f){f.setAttribute('width',w);f.setAttribute('height',h);}
            }
            resize();window.addEventListener('resize',resize);
          })();
        ]]></xhtml:script>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>
