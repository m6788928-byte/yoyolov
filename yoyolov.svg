<?xml version="1.0" encoding="UTF-8"?>
<!--
  Yoyolov's own SVG launcher.
  You control this file in m6788928-byte/yoyolov.
  To change which app opens, edit the iframe src below.
  The app itself is served from this same repository's GitHub Pages site.
  This file does not modify or depend on the original owner's SVG.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%"
     viewBox="0 0 1920 1080"
     preserveAspectRatio="none">
  <title>Yoyolov</title>
  <foreignObject x="0" y="0" width="1920" height="1080">
    <xhtml:html xmlns="http://www.w3.org/1999/xhtml"
                style="width:100%;height:100%;margin:0;padding:0;">
      <xhtml:head>
        <xhtml:meta charset="UTF-8"/>
        <xhtml:style>
          *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
          html,body{width:100%;height:100%;overflow:hidden;background:#000}
          iframe{display:block;width:100%;height:100%;border:0}
        </xhtml:style>
      </xhtml:head>
      <xhtml:body>
        <!-- Change this URL to change the site opened by this SVG. -->
        <xhtml:iframe
          title="Yoyolov"
          src="https://m6788928-byte.github.io/yoyolov/"
          allowfullscreen="true"/>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>
