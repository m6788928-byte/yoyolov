<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music</title>
<!--
  JSON format this player expects:

  {
    "music": [
      {
        "artist": "Artist",
        "poster": "https://example.com/artist.png",
        "albums": [
          {
            "name": "album1",
            "cover": "https://example.com/cover.png",
            "songs": [
              { "name": "songname",  "url": "https://example.com/song.mp3" },
              { "name": "songname2", "url": "https://example.com/song2.mp3" }
            ]
          }
        ]
      }
    ]
  }
-->
<style>
  :root {
    --bg: #111214;
    --surface: #1a1b1f;
    --surface-2: #24262b;
    --line: #2c2e34;
    --text: #ecedee;
    --muted: #8d9097;
    --accent: #ff7a59;
    --bar-h: 84px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px;
    background: rgba(17, 18, 20, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  #back {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface);
  }
  #back:hover { background: var(--surface-2); }
  #back[hidden] { display: none; }
  #crumb { margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 24px calc(var(--bar-h) + 40px); }
  h2 { font-size: 22px; margin: 0 0 16px; font-weight: 700; }
  section + section { margin-top: 40px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 8px 0; }

  /* Artwork (image with letter fallback) */
  .art {
    position: relative; overflow: hidden;
    background: var(--surface-2);
    display: grid; place-items: center;
    color: var(--muted); font-weight: 700; font-size: 28px;
    aspect-ratio: 1 / 1; width: 100%;
    border-radius: 10px;
  }
  .art.round { border-radius: 50%; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Recently played row */
  .row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .row .card { flex: 0 0 140px !important; width: 140px !important; min-width: 140px; max-width: 140px; }
  .row .card > .art { width: 100%; aspect-ratio: 1 / 1; }

  /* Grids */
  .grid { display: grid; gap: 24px 20px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .card { display: block; text-align: left; width: 100%; padding: 10px; border-radius: 12px; transition: background .15s; }
  .card:hover { background: var(--surface); }
  .card .title { margin-top: 10px; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.artist { text-align: center; }

  /* Artist / album hero */
  .hero { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 32px; }
  .hero .art { width: 180px; flex: 0 0 180px; font-size: 56px; }
  .hero h1 { margin: 4px 0 6px; font-size: clamp(28px, 5vw, 48px); line-height: 1.1; }
  .hero .kind { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* Song list */
  .songs { list-style: none; margin: 0; padding: 0; }
  .song {
    display: grid; grid-template-columns: 32px 40px minmax(0, 1fr); align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 12px 14px; border-radius: 8px;
  }
  .song:hover { background: var(--surface); }
  .song-art { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 6px; font-size: 15px; }
  .song .num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .song .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song.playing .name, .song.playing .num { color: var(--accent); }
  .song:disabled { opacity: .62; cursor: not-allowed; }
  .song:disabled:hover { background: none; }

  /* Player bar */
  #player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    height: var(--bar-h);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr);
    align-items: center; gap: 16px;
    padding: 0 20px;
    background: #17181b;
    border-top: 1px solid var(--line);
  }
  #player[hidden] { display: none; }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now .art { width: 52px; flex: 0 0 52px; font-size: 18px; border-radius: 6px; }
  .now .meta { min-width: 0; }
  .now .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .center { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .buttons { display: flex; align-items: center; gap: 18px; }
  .buttons button { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }
  .buttons button:hover { color: var(--text); }
  .buttons button#shuffle.active { color: var(--accent); background: var(--surface-2); }
  .buttons button#shuffle { width: 32px; height: 32px; }
  .buttons button:disabled { opacity: .35; cursor: default; }
  .buttons #toggle { width: 38px; height: 38px; background: var(--text); color: var(--bg); }
  .buttons #toggle:hover { color: var(--bg); transform: scale(1.05); }
  .seekline { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 560px; }
  .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; width: 36px; }
  .time:first-child { text-align: right; }

  .right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; color: var(--muted); }
  .right input { width: 110px; }

  input[type=range] {
    --fill: 0%;
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 2px; cursor: pointer; margin: 0;
    background: linear-gradient(to right, var(--text) var(--fill), #3a3c42 var(--fill));
  }
  input[type=range]:hover { background: linear-gradient(to right, var(--accent) var(--fill), #3a3c42 var(--fill)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--text); }

  /* Song rows with an action button (add / remove) */
  .songrow { display: flex; align-items: center; gap: 4px; border-radius: 8px; padding-right: 6px; }
  .songrow:hover { background: var(--surface); }
  .songrow .song { flex: 1; min-width: 0; }
  .songrow .song:hover { background: none; }
  .spotify-link { flex:none; color:var(--muted); font-size:11px; text-decoration:none; padding:5px 4px; }
  .spotify-link:hover { color:var(--text); text-decoration:underline; }
  .iconbtn { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .iconbtn:hover { color: var(--text); background: var(--surface-2); }

  /* Buttons */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn { padding: 9px 16px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 600; }
  .btn:hover { background: #2e3036; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); color: #111214; }
  .btn.primary:hover { background: #ff8d70; }
  .btn.danger { color: #ff8f8f; }

  /* Playlists */
  .art.new { background: none; border: 2px dashed var(--line); font-size: 40px; font-weight: 400; }
  .card:hover .art.new { border-color: var(--muted); color: var(--text); }
  .hero .art.editable { cursor: pointer; }
  .hero .art.editable:hover { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Dialog */
  dialog {
    padding: 0; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); color: var(--text);
    width: min(420px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .dlg { padding: 22px; }
  .dlg h3 { margin: 0 0 16px; font-size: 18px; overflow-wrap: anywhere; }
  .field {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
  }
  .label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .icon-preview { width: 120px; margin: 0 auto 18px; }
  .icon-tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .picklist { display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow-y: auto; }
  .pick { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border-radius: 8px; text-align: left; }
  .pick:hover { background: var(--surface-2); }
  .pick .art { width: 44px; flex: 0 0 44px; font-size: 16px; border-radius: 6px; }
  .pick .t { font-weight: 600; font-size: 14px; }
  .pick .s { font-size: 12px; color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: calc(var(--bar-h) + 16px); transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }

  code { background: var(--surface); padding: 2px 6px; border-radius: 4px; word-break: break-all; }

  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    main { padding: 16px 16px calc(var(--bar-h) + 32px); }
    #player { grid-template-columns: minmax(0, 1fr) auto; padding: 0 12px; }
    .right, .seekline .time { display: none; }
    .seekline { position: absolute; top: -2px; left: 0; right: 0; max-width: none; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero .art { width: 140px; flex-basis: auto; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px 8px; }
  }
</style>
</head>
<body>

<header>
  <button id="back" aria-label="Back" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 id="crumb">Music</h1>
</header>

<main id="view"><p class="muted">Loading music…</p></main>

<footer id="player" hidden>
  <div class="now">
    <div id="now-art"></div>
    <div class="meta">
      <div class="t" id="now-title"></div>
      <div class="a" id="now-artist"></div>
    </div>
  </div>

  <div class="center">
    <div class="buttons">
      <button id="shuffle" aria-label="Shuffle off" aria-pressed="false" title="Shuffle off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h2.5a5 5 0 0 0 4-2l7-8a5 5 0 0 1 4-2H22M2 6h2.5a5 5 0 0 1 4 2l1.2 1.4M14.5 14.5l1 1.5a5 5 0 0 0 4 2H22"/></svg>
      </button>
      <button id="prev" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button id="toggle" aria-label="Play"></button>
      <button id="next" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="seekline">
      <span class="time" id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span class="time" id="dur">0:00</span>
    </div>
  </div>

  <div class="right">
    <button id="add-current" class="iconbtn" aria-label="Add to playlist" title="Add to playlist">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  </div>
</footer>

<dialog id="dialog"></dialog>
<div id="toast" role="status"></div>
<audio id="audio" preload="metadata"></audio>

<script>
/* ============================================================
   SETTINGS — change this to where your .json file lives
   ============================================================ */
const JSON_URL   = "https://raw.githubusercontent.com/m6788928-byte/yoyolov/main/tabs/music/music.json";
const RECENT_MAX = 10;
const RECENT_KEY = "music.recent";
const VOLUME_KEY = "music.volume";
const PLAYLIST_KEY = "music.playlists";

/* ---------- small helpers ---------- */
const $ = (id) => document.getElementById(id);

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "onclick") node.addEventListener("click", v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

// Square/round artwork; falls back to the first letter if the image is missing or fails.
function art(src, label, round) {
  const box = el("div", { class: "art" + (round ? " round" : "") }, (label || "?").trim().charAt(0).toUpperCase());
  if (src) {
    const img = el("img", { src, alt: "", loading: "lazy" });
    img.addEventListener("error", () => img.remove());
    box.append(img);
  }
  return box;
}

// Resolve and cache official single artwork for each track.
const ART_KEY = "music.artwork.cache";
const PLAYLIST_ART_KEY = "music.playlist.artwork.cache";
const SPOTIFY_TRACK_ART_KEY = "music.spotify.track.art.cache";
const artworkCache = load(ART_KEY, {});
const playlistArtworkCache = load(PLAYLIST_ART_KEY, {});
const spotifyTrackArtworkCache = load(SPOTIFY_TRACK_ART_KEY, {});
const spotifyPlaylistTrackJobs = new Map();
const spotifyPlaylistEntityJobs = new Map();
const spotifyTrackArtworkJobs = new Map();
const spotifyTrackArtworkQueue = [];
let spotifyTrackArtworkWorkers = 0;
const artworkQueue = [];
const artworkJobs = new Map();
let artworkWorkers = 0;
const ARTWORK_CONCURRENCY = 6;
const artworkKey = track => [track.name, track.artist || ""].join("|").toLowerCase();
const artworkClean = value => String(value || "").normalize("NFKD")
  .replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "");

function artworkBox(track) {
  const box = art(track.cover || "", track.name);
  box.classList.add("song-art");
  if (!track.cover) {
    if (track.spotifySourceUrl) resolveSpotifyPlaylistTrackArtwork(track, box);
    else resolveArtwork(track, box);
  }
  return box;
}
function spotifyClean(value) {
  return String(value || "").normalize("NFKD").replace(/[\\u0300-\\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "");
}
async function spotifyEmbedEntity(url) {
  const relay = "https://web.scraper.workers.dev/?" + new URLSearchParams({
    url, selector: "script#__NEXT_DATA__", scrape: "text"
  });
  const response = await fetch(relay, { cache: "no-store" });
  if (!response.ok) throw new Error("Spotify metadata relay failed");
  const payload = await response.json();
  const raw = payload?.result?.["script#__NEXT_DATA__"];
  const source = Array.isArray(raw) ? raw[0] : raw;
  if (typeof source !== "string") throw new Error("Spotify metadata not found");
  const next = JSON.parse(source);
  const entity = next?.props?.pageProps?.state?.data?.entity;
  if (!entity) throw new Error("Spotify playlist metadata is unavailable");
  return entity;
}
function spotifyPlaylistEntity(sourceUrl) {
  let job = spotifyPlaylistEntityJobs.get(sourceUrl);
  if (!job) {
    const id = sourceUrl.match(/playlist\/([A-Za-z0-9]+)/)?.[1];
    if (!id) return Promise.reject(new Error("Invalid Spotify playlist link"));
    job = spotifyEmbedEntity("https://open.spotify.com/embed/playlist/" + id);
    spotifyPlaylistEntityJobs.set(sourceUrl, job);
    job.catch(() => spotifyPlaylistEntityJobs.delete(sourceUrl));
  }
  return job;
}
function spotifyPlaylistTracks(sourceUrl) {
  let job = spotifyPlaylistTrackJobs.get(sourceUrl);
  if (!job) {
    job = spotifyPlaylistEntity(sourceUrl)
      .then(entity => Array.isArray(entity.trackList) ? entity.trackList : []);
    spotifyPlaylistTrackJobs.set(sourceUrl, job);
    job.catch(() => spotifyPlaylistTrackJobs.delete(sourceUrl));
  }
  return job;
}
function spotifyTrackCover(trackId) {
  if (spotifyTrackArtworkCache[trackId]) return Promise.resolve(spotifyTrackArtworkCache[trackId]);
  if (spotifyTrackArtworkJobs.has(trackId)) return spotifyTrackArtworkJobs.get(trackId);
  const promise = new Promise(resolve => {
    spotifyTrackArtworkQueue.push({ trackId, resolve });
    runSpotifyTrackArtworkQueue();
  });
  spotifyTrackArtworkJobs.set(trackId, promise);
  return promise;
}
function runSpotifyTrackArtworkQueue() {
  while (spotifyTrackArtworkWorkers < 4 && spotifyTrackArtworkQueue.length) {
    const task = spotifyTrackArtworkQueue.shift();
    spotifyTrackArtworkWorkers++;
    (async () => {
      let cover = "";
      try {
        const entity = await spotifyEmbedEntity("https://open.spotify.com/embed/track/" + task.trackId);
        const images = entity.visualIdentity?.image || entity.coverArt?.sources || entity.images || [];
        const image = images.find(item => item && /^https:\/\//.test(item.url || ""));
        cover = image?.url || "";
        if (cover) {
          spotifyTrackArtworkCache[task.trackId] = cover;
          try { localStorage.setItem(SPOTIFY_TRACK_ART_KEY, JSON.stringify(spotifyTrackArtworkCache)); } catch (_) {}
        }
      } catch (_) {}
      task.resolve(cover);
      spotifyTrackArtworkJobs.delete(task.trackId);
      spotifyTrackArtworkWorkers--;
      runSpotifyTrackArtworkQueue();
    })();
  }
}
function matchSpotifyTrack(items, track) {
  const title = spotifyClean(track.name);
  const artist = spotifyClean(track.artist);
  const artistTokens = String(track.artist || "").split(",").map(spotifyClean).filter(Boolean);
  return items.map(item => {
    const candidateTitle = spotifyClean(item.title);
    const candidateArtist = spotifyClean(item.subtitle);
    const titleScore = candidateTitle === title ? 8 :
      candidateTitle.length > 3 && (candidateTitle.includes(title) || title.includes(candidateTitle)) ? 5 : 0;
    const artistScore = !artist || !candidateArtist ? 0 :
      candidateArtist === artist ? 5 :
      artistTokens.some(token => token.length > 2 && candidateArtist.includes(token)) ? 2 : 0;
    return { item, score: titleScore + artistScore };
  }).sort((a, b) => b.score - a.score)[0];
}
function resolveSpotifyPlaylistTrackArtwork(track, box) {
  spotifyPlaylistTracks(track.spotifySourceUrl).then(async items => {
    const best = matchSpotifyTrack(items, track);
    const uri = best?.item?.uri || "";
    const id = uri.match(/^spotify:track:([A-Za-z0-9]+)/)?.[1];
    if (!id || !best || best.score < 7) { resolveArtwork(track, box); return; }
    const cover = await spotifyTrackCover(id);
    if (!cover) { resolveArtwork(track, box); return; }
    track.cover = cover;
    track.spotifyUrl = "https://open.spotify.com/track/" + id;
    setArtwork(box, cover);
    const row = box.closest(".songrow");
    if (row && !row.querySelector(".spotify-link")) {
      const link = el("a", { class: "spotify-link", href: track.spotifyUrl, target: "_blank", rel: "noopener noreferrer", title: "Open this track on Spotify" }, "Spotify ↗");
      row.insertBefore(link, row.querySelector(".iconbtn") || null);
    }
  }).catch(() => resolveArtwork(track, box));
}
function setArtwork(box, url) {
  // Rows are built detached before they are inserted into #view; update them either way.
  if (!box) return;
  let img = box.querySelector("img");
  if (!img) { img = el("img", { alt: "", loading: "lazy" }); box.append(img); }
  img.src = url;
}
function resolveArtwork(track, box) {
  const key = artworkKey(track);
  if (track.cover) return;
  if (artworkCache[key]) { track.cover = artworkCache[key]; setArtwork(box, track.cover); return; }
  let job = artworkJobs.get(key);
  if (!job) {
    job = { key, track, boxes: [] };
    artworkJobs.set(key, job);
    artworkQueue.push(job);
  }
  job.boxes.push(box);
  runArtworkQueue();
}
async function searchArtwork(track, includeArtist) {
  const title = track.name.replace(/\s*[([](?:original|extended|radio|club|vocal|remix|mix|edit|remaster)[^\])]*[)\]]/ig, "").trim();
  const term = [title || track.name, includeArtist ? track.artist : ""].filter(Boolean).join(" ");
  const endpoint = "https://itunes.apple.com/search?" + new URLSearchParams({
    term, entity: "song", media: "music", country: "US", limit: "20"
  });
  const response = await fetch(endpoint, { mode: "cors" });
  if (!response.ok) throw new Error("Artwork lookup failed: " + response.status);
  return (await response.json()).results || [];
}
function chooseArtwork(results, track) {

  const wanted = [...new Set(variants.map(artworkClean).filter(x => x.length > 2))];

    const title = artworkClean(item.trackName), by = artworkClean(item.artistName);
    const titleScore = Math.max(0, ...wanted.map(w => title === w ? 8 : title && (title.includes(w) || w.includes(title)) ? 6 : 0));
    const artistBits = artist.split(" ").filter(x => x.length > 2);
    const overlap = artistBits.filter(x => by.includes(x)).length;
    const artistScore = !artistBits.length ? 0 : by === artist ? 4 : overlap >= 2 ? 3 : overlap === 1 ? 1 : 0;
    return { item, score: titleScore + artistScore };

function runArtworkQueue() {

    const job = artworkQueue.shift();
    artworkWorkers++;
    (async () => {
      try {
        let results = await searchArtwork(job.track, true);
        let best = chooseArtwork(results, job.track);
        if (!best || best.score < 5) {
          results = await searchArtwork(job.track, false);
          best = chooseArtwork(results, job.track);
        }
        const url = best && best.score >= 5 && best.item.artworkUrl100;
        if (url) {
          const cover = url.replace(/\d+x\d+bb\.jpg.*$/i, "1200x1200bb.jpg");
          artworkCache[job.key] = cover;
          try { localStorage.setItem(ART_KEY, JSON.stringify(artworkCache)); } catch (_) {}
          job.track.cover = cover;
          job.boxes.forEach(box => setArtwork(box, cover));
          if (current() && current().url === job.track.url) {

          }
        }
      } catch (_) {

      } finally {

        artworkWorkers--;

      }

// Spotify's oEmbed does not expose CORS headers. AllOrigins provides a raw
// metadata pass-through; playlist artwork is never inferred from track one.
const playlistArtworkJobs = new Map();
function playlistArtBox(p) {
  const box = art(p.cover || "", p.name);
  if (!p.cover) resolvePlaylistArtwork(p, box);
  return box;
}
function resolvePlaylistArtwork(p, box) {
  const key = p.sourceUrl || p.name;
  if (!key) return;
  const cached = playlistArtworkCache[key];
  if (cached) { p.cover = cached; setArtwork(box, cached); return; }
  let job = playlistArtworkJobs.get(key);
  if (!job) {
    job = { boxes: [] };
    playlistArtworkJobs.set(key, job);
    (async () => {
      try {
        let endpoint;
        if (/open\.spotify\.com/i.test(p.sourceUrl)) {
          endpoint = "https://open.spotify.com/oembed?url=" + encodeURIComponent(p.sourceUrl);
        } else if (/soundcloud\.com/i.test(p.sourceUrl)) {
          endpoint = "https://soundcloud.com/oembed?format=json&url=" + encodeURIComponent(p.sourceUrl);
        } else return;
        const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(endpoint);
        const response = await fetch(proxy, { cache: "no-store" });
        if (!response.ok) throw new Error("Playlist artwork lookup failed");
        const data = await response.json();
        const cover = data.thumbnail_url || data.thumbnailUrl || "";
        if (!cover) return;
        playlistArtworkCache[key] = cover;
        try { localStorage.setItem(PLAYLIST_ART_KEY, JSON.stringify(playlistArtworkCache)); } catch (_) {}
        p.cover = cover;
        job.boxes.forEach(target => setArtwork(target, cover));
      } catch (_) {
        // No track-one fallback: keep the neutral placeholder.
      } finally { playlistArtworkJobs.delete(key); }
    })();
  }
  job.boxes.push(box);
}
function fmt(sec) {
  if (!isFinite(sec) || sec < 0) return "0:00";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; /* storage full or unavailable */ }
}
function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }

let toastTimer;

/* ---------- library ---------- */
let library = [];   // normalised artist/album catalog
let catalogPlaylists = [];

function normalise(data) {
  if (!data || !Array.isArray(data.music)) throw new Error('The JSON needs a top-level "music" array.');
  return data.music.map((a) => ({
    artist: String(a.artist || "Unknown artist"),
    poster: a.poster || "",
    albums: (Array.isArray(a.albums) ? a.albums : []).map((al) => ({
      name: String(al.name || "Untitled album"),
      cover: al.cover || "",
      songs: (Array.isArray(al.songs) ? al.songs : [])
        .filter((s) => s && s.url)
        .map((s) => ({ name: String(s.name || "Untitled"), url: String(s.url) })),
    })),
  }));
}

function normalisePlaylists(items) {
  return (Array.isArray(items) ? items : []).map((p) => ({
    name: String(p.name || "Untitled playlist"),
    cover: p.cover || "",
    sourceUrl: p.sourceUrl || "",
    spotifyImport: !!p.spotifyImport,
    useSpotifyName: !!p.useSpotifyName,
    maxSongs: Math.min(100, Math.max(1, Number(p.maxSongs) || 100)),
    songs: (Array.isArray(p.songs) ? p.songs : []).map((s) => ({
      name: String(s.name || "Untitled"),
      artist: String(s.artist || ""),
      url: s.url ? String(s.url) : "",
      unavailable: !!s.unavailable,
      cover: s.cover ? String(s.cover) : "",
    })),
  }));
}
async function hydrateSpotifyCatalogPlaylists() {
  await Promise.all(catalogPlaylists.map(async (p, index) => {
    if (!p.spotifyImport || p._loaded || p._loading) return;
    p._loading = true; p._loadError = "";
    try {
      const entity = await spotifyPlaylistEntity(p.sourceUrl);
      const list = Array.isArray(entity.trackList) ? entity.trackList.slice(0, p.maxSongs) : [];
      p.songs = list.filter(t => t && t.title).map(t => ({
        name: String(t.title), artist: String(t.subtitle || ""),
        url: "", unavailable: false, cover: "", spotifyUri: String(t.uri || ""),
      }));
      if (p.useSpotifyName && entity.name) p.name = String(entity.name);
      const images = [
        ...(Array.isArray(entity.visualIdentity?.image) ? entity.visualIdentity.image : []),
        ...(Array.isArray(entity.coverArt?.sources) ? entity.coverArt.sources : []),
        ...(Array.isArray(entity.images) ? entity.images : []),
      ];
      const image = images.map(x => typeof x === "string" ? x : x?.url).find(x => /^https:\/\//.test(x || ""));
      if (image) p.cover = image;
      if (!p.songs.length) p._loadError = "Spotify returned no tracks for this playlist.";
      p._loaded = true;
    } catch (error) {
      p._loadError = error.message || "Spotify playlist import failed.";
    } finally {
      p._loading = false;
      if (location.hash === "#/catalog-playlist/" + index || !location.hash || location.hash === "#/") render(true);
    }
  }));
}
function albumTracks(ai, bi) {
  const artist = library[ai], album = artist.albums[bi];
  return album.songs.map((s) => ({
    name: s.name, url: s.url,
    artist: s.artist || artist.artist, album: album.name,
    cover: album.cover || artist.poster || "",
  }));
}

/* ---------- recently played ---------- */
function getRecent() {
  const r = load(RECENT_KEY, []);
  return Array.isArray(r) ? r.filter((t) => t && t.url) : [];
}
function addRecent(track) {
  const list = getRecent().filter((t) => t.url !== track.url);
  list.unshift(track);
  store(RECENT_KEY, list.slice(0, RECENT_MAX));
}

/* ---------- playlists (saved in local storage) ---------- */
// Stored as: [{ id, name, icon, songs: [{ name, url, artist, album, cover }] }]
function getPlaylists() {
  const p = load(PLAYLIST_KEY, []);
  if (!Array.isArray(p)) return [];
  return p.filter((x) => x && x.id).map((x) => ({
    id: String(x.id),
    name: String(x.name || "Untitled playlist"),
    icon: typeof x.icon === "string" ? x.icon : "",
    songs: Array.isArray(x.songs) ? x.songs.filter((t) => t && (t.name || t.url)).map(t => ({ ...t })) : [],
  }));
}
const cleanTrackPart = value => String(value || "").normalize("NFKD")
  .replace(/[\\u0300-\\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function catalogTrackKey(track) {
  return cleanTrackPart(track.name) + "|" + cleanTrackPart(track.artist);
}
function sameTrack(a, b) {
  if (a.catalogKey && b.catalogKey && a.catalogKey === b.catalogKey) return true;
  if (a.url && b.url) return a.url === b.url;
  return catalogTrackKey(a) === catalogTrackKey(b);
}
function syncSavedCatalogTracks() {
  const saved = load(PLAYLIST_KEY, []);
  if (!Array.isArray(saved) || !saved.length) return;
  let changed = false;
  for (const list of saved) {
    for (const song of list.songs || []) {
      if (!song.catalogKey) continue;
      const source = catalogPlaylists.find(p => p.name === song.catalogPlaylist);
      const current = source && source.songs.find(s => catalogTrackKey(s) === song.catalogKey);
      if (!current) continue;
      for (const field of ["url", "cover", "artist", "album"]) {
        const value = field === "album" ? source.name : current[field];
        if (value && song[field] !== value) { song[field] = value; changed = true; }
      }
    }
  }
  if (changed) savePlaylists(saved);
}
function savePlaylists(list) {
  if (store(PLAYLIST_KEY, list)) return true;
  toast("Couldn't save. Browser storage is full or turned off.");
  return false;
}
function findPlaylist(id) { return getPlaylists().find((p) => p.id === id) || null; }
function updatePlaylist(id, change) {
  const list = getPlaylists();
  const p = list.find((x) => x.id === id);
  if (!p) return false;
  change(p);
  return savePlaylists(list);
}
function createPlaylist(name) {
  const list = getPlaylists();
  const p = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, icon: "", songs: [] };
  list.push(p);
  return savePlaylists(list) ? p : null;
}
// The icon you picked, or the first song's cover until you pick one.
function playlistIcon(p) { return p.icon || (p.songs[0] && p.songs[0].cover) || ""; }
function songCount(n) { return n + (n === 1 ? " song" : " songs"); }

function addToPlaylist(id, track) {
  const p = findPlaylist(id);
  if (!p) return;
  if (p.songs.some(s => sameTrack(s, track))) { toast("Already in “" + p.name + "”."); return; }
  const song = {
    name: track.name, url: track.url || "", artist: track.artist || "",
    album: track.album || "", cover: track.cover || "",
    catalogKey: track.catalogKey || (track.catalogPlaylist ? catalogTrackKey(track) : ""),
    catalogPlaylist: track.catalogPlaylist || "",
  };
  if (updatePlaylist(id, x => x.songs.push(song))) toast("Added to “" + p.name + "”.");
}

// Uploaded pictures are cropped square and shrunk so they fit in local storage.
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const size = 300, side = Math.min(img.width, img.height);
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#24262b";
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- player ---------- */
const audio = $("audio");
let queue = [], baseQueue = [], index = -1, seeking = false, shuffleOn = false;

const ICON_PLAY  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function current() { return queue[index] || null; }

function shuffled(items) {
  const out = items.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function loadQueueIndex(i) {
  if (i < 0 || i >= queue.length || !queue[i]?.url) return;
  index = i;
  const t = current();
  audio.src = t.url;
  audio.play().catch(() => {});
  addRecent(t);
  renderPlayer();
  markPlaying();
  if (location.hash === "" || location.hash === "#/") render();
}

function playQueue(tracks, i) {
  if (!tracks.length || !tracks[i]?.url) return;
  baseQueue = tracks.slice();
  if (shuffleOn) {
    queue = [baseQueue[i], ...shuffled(baseQueue.filter((_, n) => n !== i))];
    loadQueueIndex(0);
  } else {
    queue = baseQueue.slice();
    loadQueueIndex(i);
  }
}

function toggleShuffle() {
  const playing = current();
  shuffleOn = !shuffleOn;
  if (shuffleOn) {
    const before = queue.slice(0, index);
    const upcoming = shuffled(queue.slice(index + 1));
    queue = [...before, playing, ...upcoming];
    index = before.length;
  } else {
    queue = baseQueue.slice();
    index = queue.indexOf(playing);
    if (index < 0) index = 0;
  }
  const button = $("shuffle");
  button.classList.toggle("active", shuffleOn);
  button.setAttribute("aria-pressed", String(shuffleOn));
  button.setAttribute("aria-label", shuffleOn ? "Shuffle on" : "Shuffle off");
  button.title = shuffleOn ? "Shuffle on" : "Shuffle off";
  renderPlayer();
}



function playRecent(track) {
  // If the song still exists in the library, queue its whole album so next/previous work.
  for (let ai = 0; ai < library.length; ai++) {
    for (let bi = 0; bi < library[ai].albums.length; bi++) {
      const tracks = albumTracks(ai, bi);
      const i = tracks.findIndex((t) => t.url === track.url);
      if (i !== -1) return playQueue(tracks, i);
    }
  }
  playQueue([track], 0);
}

function next() { if (index < queue.length - 1) loadQueueIndex(index + 1); }
function prev() {
  if (audio.currentTime > 3 || index === 0) { audio.currentTime = 0; return; }
  loadQueueIndex(index - 1);
}
function toggle() {
  if (!current()) return;
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
}

function renderPlayer() {
  const t = current();
  if (!t) return;
  $("player").hidden = false;
  $("now-art").replaceChildren(artworkBox(t));
  $("now-title").textContent = t.name;
  $("now-artist").textContent = t.artist + (t.album ? " · " + t.album : "");
  $("prev").disabled = false;
  $("next").disabled = index >= queue.length - 1;
  document.title = t.name + " · " + t.artist;
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.name, artist: t.artist, album: t.album || "",
        artwork: t.cover ? [{ src: t.cover }] : [],
      });
    } catch (e) {}
  }
}

function setFill(input, fraction) {
  input.style.setProperty("--fill", (Math.max(0, Math.min(1, fraction)) * 100) + "%");
}

function markPlaying() {
  const t = current();
  document.querySelectorAll(".song").forEach((row) => {
    row.classList.toggle("playing", !!t && row.dataset.url === t.url);
  });
}

audio.addEventListener("play",  () => { $("toggle").innerHTML = ICON_PAUSE; $("toggle").setAttribute("aria-label", "Pause"); });
audio.addEventListener("pause", () => { $("toggle").innerHTML = ICON_PLAY;  $("toggle").setAttribute("aria-label", "Play"); });

audio.addEventListener("timeupdate", () => {
  if (seeking) return;
  const f = audio.duration ? audio.currentTime / audio.duration : 0;
  $("seek").value = Math.round(f * 1000);
  setFill($("seek"), f);
  $("cur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("ended", next);

$("toggle").innerHTML = ICON_PLAY;
$("shuffle").addEventListener("click", toggleShuffle);
$("toggle").addEventListener("click", toggle);
$("prev").addEventListener("click", prev);
$("next").addEventListener("click", next);

$("seek").addEventListener("input", (e) => {
  seeking = true;
  const f = e.target.value / 1000;
  setFill(e.target, f);
  $("cur").textContent = fmt(f * (audio.duration || 0));
});
$("seek").addEventListener("change", (e) => {
  if (audio.duration) audio.currentTime = (e.target.value / 1000) * audio.duration;
  seeking = false;
});

const savedVolume = Number(load(VOLUME_KEY, 1));
audio.volume = isFinite(savedVolume) ? Math.max(0, Math.min(1, savedVolume)) : 1;
$("vol").value = audio.volume;
setFill($("vol"), audio.volume);
$("vol").addEventListener("input", (e) => {
  audio.volume = Number(e.target.value);
  setFill(e.target, audio.volume);
  store(VOLUME_KEY, audio.volume);
});

if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("previoustrack", prev);
    navigator.mediaSession.setActionHandler("nexttrack", next);
  } catch (e) {}
}

document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || dialog.open) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "button" || tag === "textarea") return;
  e.preventDefault();
  toggle();
});

/* ---------- views ---------- */
const view = $("view");

function setHeader(title, showBack) {
  $("crumb").textContent = title;
  $("back").hidden = !showBack;
}

function renderHome() {
  setHeader("Music", false);

  const recent = getRecent();
  const recentSection = el("section", null, el("h2", null, "Recently played"));
  if (recent.length) {
    const row = el("div", { class: "row" });
    recent.forEach((t) => {
      const cover = art(t.cover, t.name);
      if (!t.cover) resolveArtwork(t, cover);
      row.append(el("button", { class: "card", onclick: () => playRecent(t) },
        cover,
        el("div", { class: "title" }, t.name),
        el("div", { class: "sub" }, t.artist || "")));
    });
    recentSection.append(row);
  } else {
    recentSection.append(el("p", { class: "empty" }, "Songs you play will show up here."));
  }

  const artistSection = el("section", null, el("h2", null, "Artists"));
  if (library.length) {
    const grid = el("div", { class: "grid" });
    library.forEach((a, ai) => {
      grid.append(el("button", { class: "card artist", onclick: () => { location.hash = "#/artist/" + ai; } },
        art(a.poster, a.artist, true),
        el("div", { class: "title" }, a.artist)));
    });
    artistSection.append(grid);
  } else {
    artistSection.append(el("p", { class: "empty" }, "No artists in the JSON file yet."));
  }

  const playlistSection = el("section", null, el("h2", null, "Playlists"));
  const playlistGrid = el("div", { class: "grid" });
  catalogPlaylists.forEach((p, pi) => {
    const cover = playlistArtBox(p);
    playlistGrid.append(el("button", { class: "card", onclick: () => { location.hash = "#/catalog-playlist/" + pi; } },
      cover,
      el("div", { class: "title" }, p.name),
      el("div", { class: "sub" }, songCount(p.songs.length))));
  });
  getPlaylists().forEach((p) => {
    const src = playlistIcon(p), cover = art(src, p.name);
    if (!src && p.songs[0]) resolveArtwork(p.songs[0], cover);
    playlistGrid.append(el("button", { class: "card", onclick: () => { location.hash = "#/playlist/" + p.id; } },
      cover,
      el("div", { class: "title" }, p.name),
      el("div", { class: "sub" }, songCount(p.songs.length))));
  });
  playlistGrid.append(el("button", { class: "card", onclick: newPlaylistDialog },
    el("div", { class: "art new" }, "+"),
    el("div", { class: "title" }, "New playlist")));
  playlistSection.append(playlistGrid);

  view.replaceChildren(recentSection, playlistSection, artistSection);
}

function renderArtist(ai) {
  const a = library[ai];
  if (!a) return renderHome();
  setHeader(a.artist, true);

  const hero = el("div", { class: "hero" },
    art(a.poster, a.artist, true),
    el("div", null,
      el("div", { class: "kind" }, "Artist"),
      el("h1", null, a.artist),
      el("div", { class: "muted" }, a.albums.length + (a.albums.length === 1 ? " album" : " albums"))));

  const section = el("section", null, el("h2", null, "Albums"));
  if (a.albums.length) {
    const grid = el("div", { class: "grid" });
    a.albums.forEach((al, bi) => {
      grid.append(el("button", { class: "card", onclick: () => { location.hash = "#/album/" + ai + "/" + bi; } },
        art(al.cover, al.name),
        el("div", { class: "title" }, al.name),
        el("div", { class: "sub" }, al.songs.length + (al.songs.length === 1 ? " song" : " songs"))));
    });
    section.append(grid);
  } else {
    section.append(el("p", { class: "empty" }, "No albums for this artist yet."));
  }

  view.replaceChildren(hero, section);
}

function renderAlbum(ai, bi) {
  const a = library[ai], al = a && a.albums[bi];
  if (!al) return renderHome();
  setHeader(al.name, true);

  const hero = el("div", { class: "hero" },
    art(al.cover, al.name),
    el("div", null,
      el("div", { class: "kind" }, "Album"),
      el("h1", null, al.name),
      el("div", { class: "muted" }, a.artist + " · " + al.songs.length + (al.songs.length === 1 ? " song" : " songs"))));

  const tracks = albumTracks(ai, bi);
  const list = el("ol", { class: "songs" });
  tracks.forEach((t, i) => {
    list.append(songRow(tracks, i, false, iconButton(ICON_PLUS, "Add to playlist", () => addDialog(t))));
  });
  if (!tracks.length) list.append(el("li", { class: "empty" }, "No songs in this album yet."));

  view.replaceChildren(hero, list);
  markPlaying();
}

function renderCatalogPlaylist(pi) {
  const p = catalogPlaylists[pi];
  if (!p) return renderHome();
  setHeader(p.name, true);
  const tracks = p.songs.map((s) => ({
    ...s, album: p.name, cover: s.cover || "", spotifySourceUrl: p.sourceUrl,
    catalogKey: catalogTrackKey(s), catalogPlaylist: p.name,
  }));
  const connected = tracks.filter((t) => !!t.url).length;
  const pending = tracks.length - connected;
  const sourceLabel = p.sourceUrl.includes("spotify.com") ? "Open on Spotify" : "Open on SoundCloud";
  const actions = p.sourceUrl
    ? el("div", { class: "actions" },
        el("a", { class: "btn", href: p.sourceUrl, target: "_blank", rel: "noopener noreferrer" }, sourceLabel))
    : null;
  const hero = el("div", { class: "hero" },
    playlistArtBox(p),
    el("div", null,
      el("div", { class: "kind" }, "Original playlist · read-only"),
      el("h1", null, p.name),
      el("div", { class: "muted" }, p._loading ? "Loading up to " + p.maxSongs + " tracks from Spotify…" : p._loadError || (tracks.length
        ? songCount(tracks.length) + " · " + connected + " playable · " + pending + " awaiting audio"
        : "Ready for audio files")),
      ...(actions ? [actions] : [])));
  const list = el("ol", { class: "songs" });
  tracks.forEach((t, i) => {
    list.append(songRow(tracks, i, true,
      iconButton(ICON_PLUS, "Add to your playlist", () => addDialog(t))));
  });
  if (!tracks.length) list.append(el("li", { class: "empty" }, p._loading ? "Importing Spotify track list…" : p._loadError || "No tracks added yet. Send the audio files when they're ready."));
  view.replaceChildren(hero, list);
}

function renderPlaylist(id) {
  const p = findPlaylist(id);
  if (!p) return renderHome();
  setHeader(p.name, true);

  const tracks = p.songs.map((s) => ({ ...s }));

  const icon = art(playlistIcon(p), p.name);
  icon.classList.add("editable");
  icon.title = "Change icon";
  icon.addEventListener("click", () => iconDialog(id));

  const playableTracks = tracks.filter(t => !!t.url);
  const playAll = el("button", { class: "btn primary", onclick: () => playQueue(playableTracks, 0) }, "Play");
  playAll.disabled = !playableTracks.length;

  const hero = el("div", { class: "hero" },
    icon,
    el("div", null,
      el("div", { class: "kind" }, "Playlist"),
      el("h1", null, p.name),
      el("div", { class: "muted" }, songCount(tracks.length)),
      el("div", { class: "actions" },
        playAll,
        el("button", { class: "btn", onclick: () => iconDialog(id) }, "Change icon"),
        el("button", { class: "btn", onclick: () => nameDialog("Rename playlist", p.name, "Save", (name) => {
          if (updatePlaylist(id, (x) => { x.name = name; })) render(true);
        }) }, "Rename"),
        el("button", { class: "btn danger", onclick: () => deleteDialog(id) }, "Delete"))));

  const list = el("ol", { class: "songs" });
  tracks.forEach((t, i) => {
    list.append(songRow(tracks, i, true, iconButton(ICON_X, "Remove from playlist", () => {
      if (updatePlaylist(id, x => { x.songs = x.songs.filter(s => !sameTrack(s, t)); })) render(true);
    })));
  });
  if (!tracks.length) list.append(el("li", { class: "empty" }, "No songs yet. Open an album and press + next to a song to add it here."));

  view.replaceChildren(hero, list);
  markPlaying();
}

function render(keepScroll) {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  if (keepScroll !== true) window.scrollTo(0, 0);
  if (parts[0] === "playlist") renderPlaylist(parts[1]);
  else if (parts[0] === "artist") renderArtist(Number(parts[1]));
  else if (parts[0] === "album") renderAlbum(Number(parts[1]), Number(parts[2]));
  else if (parts[0] === "catalog-playlist") renderCatalogPlaylist(Number(parts[1]));
  else renderHome();
}

$("back").addEventListener("click", () => {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  location.hash = parts[0] === "album" ? "#/artist/" + parts[1] : "#/";
});
window.addEventListener("hashchange", render);

/* ---------- start ---------- */
fetch(JSON_URL, { cache: "no-store" })
  .then((res) => { if (!res.ok) throw new Error("The server answered " + res.status + "."); return res.json(); })
  .then((data) => {
    library = normalise(data);
    catalogPlaylists = normalisePlaylists(data.playlists);
    syncSavedCatalogTracks();
    render();
    hydrateSpotifyCatalogPlaylists();
  })
  .catch((err) => {
    setHeader("Music", false);
    view.replaceChildren(
      el("h2", null, "Couldn't load music"),
      el("p", { class: "muted" }, err.message || "Unknown error."),
      el("p", { class: "muted" }, "Tried to load: ", el("code", null, JSON_URL)),
      el("p", { class: "muted" }, "error fetching json."));
  });
</script>
</body>
</html>
