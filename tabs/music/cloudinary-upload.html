<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist Audio Uploader</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111214;color:#eee;font:14px system-ui,sans-serif;padding:28px}
main{max-width:680px;margin:auto}h1{font-size:22px;margin:0 0 8px}p,.muted{color:#999}
label{display:block;margin:18px 0 6px;color:#bbb}input{width:100%;padding:10px;background:#1b1d21;color:#eee;border:1px solid #383c43;border-radius:6px}
button{margin-top:18px;padding:10px 16px;background:#eee;color:#111;border:0;border-radius:6px;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:default}
#status{margin-top:18px;white-space:pre-wrap;color:#bbb;line-height:1.7}progress{width:100%;height:10px;margin-top:12px}
</style>
<main>
<h1>Playlist Audio Uploader</h1>
<p>Select the ZIP archives directly or select extracted MP3 files. ZIPs are extracted in your browser; audio uploads to your Cloudinary account under <b>playlist-audio</b>.</p>
<label>Cloudinary cloud name</label><input id="cloud" autocomplete="off" value="ak3j5wsb">
<label>Unsigned upload preset</label><input id="preset" autocomplete="off" placeholder="Your unsigned preset">
<label>ZIP archives or MP3 files</label><input id="files" type="file" accept=".zip,.mp3,audio/mpeg" multiple>
<button id="go">Extract and upload audio</button>
<progress id="progress" max="1" value="0"></progress><div id="status" role="status"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id), status=$('status'), button=$('go');
$('go').onclick=async()=>{
 const cloud=$('cloud').value.trim(),preset=$('preset').value.trim(),selected=[...$('files').files];
 if(!cloud||!preset||!selected.length){status.textContent='Enter your Cloudinary unsigned preset and select the ZIPs or MP3s.';return}
 button.disabled=true;
 try{
  if(typeof JSZip==='undefined')throw Error('Could not load ZIP support. Refresh the page and try again.');
  status.textContent='Reading selected files…';
  const files=[];
  for(const file of selected){
   if(file.name.toLowerCase().endsWith('.zip')){
    const zip=await JSZip.loadAsync(file);
    for(const entry of Object.values(zip.files)){
     if(!entry.dir&&entry.name.toLowerCase().endsWith('.mp3')){
      const blob=await entry.async('blob');
      files.push(new File([blob],entry.name.split('/').pop(),{type:'audio/mpeg'}));
     }
    }
   }else if(file.name.toLowerCase().endsWith('.mp3'))files.push(file);
  }
  const unique=new Map(files.map(file=>[file.name.toLowerCase(),file]));
  const audio=[...unique.values()];
  if(!audio.length)throw Error('No MP3 files found in the selected ZIPs.');
  status.textContent='Found '+audio.length+' unique MP3 files. Uploading…';
  const results=new Array(audio.length);let done=0,next=0;
  async function worker(){while(next<audio.length){const i=next++,file=audio[i];try{
   const form=new FormData();form.append('file',file);form.append('upload_preset',preset);form.append('folder','playlist-audio');
   const r=await fetch('https://api.cloudinary.com/v1_1/'+encodeURIComponent(cloud)+'/video/upload',{method:'POST',body:form});
   const data=await r.json();if(!r.ok)throw Error(data.error?.message||'HTTP '+r.status);
   results[i]={filename:file.name,secure_url:data.secure_url,public_id:data.public_id,bytes:data.bytes};
  }catch(e){results[i]={filename:file.name,error:String(e.message||e)}}
   done++;$('progress').value=done/audio.length;
   status.textContent='Uploaded '+done+'/'+audio.length+' · failed '+results.filter(x=>x?.error).length;
  }}
  await Promise.all(Array.from({length:Math.min(3,audio.length)},worker));
  const blob=new Blob([JSON.stringify(results.filter(Boolean),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='playlist-upload-results.json';a.click();
  status.textContent+='\\nFinished. Send playlist-upload-results.json back here.';
 }catch(e){status.textContent='Error: '+(e.message||e)+(String(e.message||e)==='Failed to fetch'?'\\nCloudinary could not be reached from this browser. Check that the internet connection allows api.cloudinary.com, then retry. The cloud name and saved preset are prefilled.':'')}
 finally{button.disabled=false}
};
</script></html>
