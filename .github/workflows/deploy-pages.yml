name: Deploy Yoyolov Pages
# Redeploy the current main branch so newly generated game files are published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html auth-config.js .nojekyll _site/
          cp -R assets openfront _site/
          test -s _site/index.html
          test -s _site/auth-config.js
          test -s _site/assets/hcde-background.avif
          test -s _site/openfront/index.html
          test -s _site/openfront/assets/index-xDRx6PtE.js
      - name: Upload site runtime
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 10000
